name: Tipsdad notifications

on:
  schedule:
    - cron: "*/5 * * * *"     # every 5 minutes (GitHub's timer; can run late)
  workflow_dispatch:          # run by hand, or by cron-job.org (reliable timer)

# Only one run at a time, so a notification is never sent twice
concurrency:
  group: tipsdad-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10       # was 4: busy runs need more time
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Load what was already sent (from the previous run)
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: tipsdad-state-${{ github.run_id }}
          restore-keys: tipsdad-state-

      - name: Send notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python notify.py

      # Save what was sent, even if the run failed or was stopped
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: tipsdad-state-${{ github.run_id }}