name: Tipsdad notifications

on:
  # Main timer: cron-job.org calls GitHub every 5 minutes with
  # {"event_type":"tick"} (same setup as CashScore / autopush). On time.
  repository_dispatch:
    types: [tick]
  # Backup only: GitHub's own timer, which often runs late or skips
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:          # run by hand from the Actions tab

# One run at a time, so nothing is sent twice
concurrency:
  group: tipsdad-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Load what was already sent (from the previous run)
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: tipsdad-state-${{ github.run_id }}
          restore-keys: tipsdad-state-

      # Each cycle: 3 notifications 5 minutes apart (results / live / extra),
      # then a 45-minute break. Plus "tips posted" when new tips are added.
      # All times are Nairobi time.
      - name: Send notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PULSE_TOPIC: ${{ vars.PULSE_TOPIC || 'tipsdad' }}
          PULSE_EVERY_MINUTES: ${{ vars.PULSE_EVERY_MINUTES || '45' }}
          MAX_PER_DAY: ${{ vars.MAX_PER_DAY || '30' }}
          AI_FACTS_PER_DAY: ${{ vars.AI_FACTS_PER_DAY || '0' }}   # 0 = AI off
        run: python notify_loop.py

      # Save what was sent, even if the run failed or was stopped
      # (skipped if the bot stopped before writing state.json)
      - uses: actions/cache/save@v4
        if: always() && hashFiles('state.json') != ''
        with:
          path: state.json
          key: tipsdad-state-${{ github.run_id }}-${{ github.run_attempt }}